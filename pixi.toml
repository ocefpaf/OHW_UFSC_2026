[workspace]
authors = ["Filipe Fernandes <ocefpaf@gmail.com>"]
channels = ["conda-forge"]
name = "OHW_UFSC_2026"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
notebook = "jupyter nbclassic --ip=127.0.0.1 --NotebookApp.iopub_data_rate_limit=1000000000"

[dependencies]
nbclassic = ">=1.3.3,<2"
pandas = ">=3.0.1,<4"
matplotlib-base = ">=3.10.8,<4"
folium = ">=0.20.0,<0.21"
scipy = ">=1.17.1,<2"
utide = ">=0.3.1,<0.4"
gsw = ">=3.6.21,<4"
ioos-qc = ">=2.3.0,<3"
